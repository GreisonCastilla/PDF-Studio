services:
  # Desarrollo con hot reload:  docker compose up dev
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Producción (nginx):  docker compose --profile prod up --build prod
  prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
    restart: unless-stopped
